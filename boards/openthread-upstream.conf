# Experiment: build the NCS RCP against UPSTREAM OpenThread instead of Nordic's sdk-openthread fork.
# Extra Kconfig needed by upstream code that the fork does not use.
# Upstream src/core/crypto/crypto_platform_psa.cpp parses ASN.1 (mbedtls_asn1_get_tag); nrf_security leaves it off.
CONFIG_MBEDTLS_ASN1_PARSE_C=y
# Upstream's crypto_platform_psa.cpp (compiled whenever the crypto lib is PSA) requires key references,
# which Zephyr only selects for non-RCP builds.
CONFIG_OPENTHREAD_PLATFORM_KEY_REF=y
# With key references the RCP's SubMac keeps its prev/curr/next MAC keys as PSA keys (3 slots). NCS sets the RCP
# slot count to 1 (the fork RCP keeps literal keys), so two of the three imports failed silently and the radio got
# all-zero MAC keys: secured frames were acked but dropped by the peer (MIC failure).
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=4
