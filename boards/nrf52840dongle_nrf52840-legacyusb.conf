# Holyiot/nRF52840 dongle on NCS 3.4.x with the LEGACY USB device stack (what the sample used up to NCS 3.2).
# Replaces the sample's boards/nrf52840dongle_nrf52840.conf (which selects USB_DEVICE_STACK_NEXT);
# the CI copies the sample and swaps this file in, so no next-only symbols are left behind.
#
# Problems fixed here:
#  - The new stack (USB_DEVICE_STACK_NEXT) misbehaved on the Raspberry Pi 3 host; the legacy stack works.
#  - Both stacks defining the CDC ACM device gave a multiple-definition link error, so the new stack is
#    explicitly disabled.
#  - The legacy stack only starts if USB_DEVICE_INITIALIZE_AT_BOOT=y (no default; nothing else calls
#    usb_enable()). Without it the dongle never shows up as a USB device.
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
# Nothing else calls usb_enable(); without this the USB device is never brought up (no enumeration).
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_MANUFACTURER="Nordic Semiconductor ASA"
CONFIG_USB_DEVICE_PRODUCT="Thread Co-Processor"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x0000

CONFIG_UART_LINE_CTRL=y

# Enable resetting to Bootloader using GPIO
CONFIG_GPIO=y
CONFIG_OPENTHREAD_PLATFORM_BOOTLOADER_MODE_GPIO=y
