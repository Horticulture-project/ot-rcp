# Diagnostic only (not for production): send the RCP's own log (energy detection start/done/failed, energy detection
# watchdog, held-back scan events) to the host over Spinel, where otbr-agent prints it and usbmon shows it as log frames.
CONFIG_LOG=y
CONFIG_OPENTHREAD_LOG_LEVEL_NOTE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_SPINEL=y
