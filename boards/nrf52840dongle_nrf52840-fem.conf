# Holyiot dongle front-end (PA/LNA) control, from the vendor's working NCS 3.1.0 config.
CONFIG_MPSL=y
CONFIG_MPSL_FEM=y
CONFIG_MPSL_FEM_SIMPLE_GPIO=y
CONFIG_GPIO=y

# Default TX power at power-up, until the host sets one ('ot-ctl txpower' is not persisted: after a reflash or
# restart the RCP is back at this value). With the FEM a requested power means power ON AIR: the radio driver
# subtracts the PA gain (tx-gain-db = 22) and rounds the nRF52840 level down to its next step, so the stock
# default 0 gave about -18 dBm on air. 16 -> SoC -6 -> rounded to -8 dBm -> about 14 dBm on air (conducted;
# EIRP adds the antenna gain, EU limit 20 dBm EIRP). Allowed range for this option: -40..20.
CONFIG_OPENTHREAD_DEFAULT_TX_POWER=16
