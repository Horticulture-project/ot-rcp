# OPTIONAL, not used by CI. Extra Kconfig fragment for MCUboot that makes it wait after every boot
# for an SMP command on the UART before starting the application. It lets the host enter recovery
# on a module whose application no longer reacts to Spinel reset-to-bootloader (crash loop, wrong
# UART variant): reset or power-cycle the module and send `mcumgr-client echo x` repeatedly.
# Costs CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT ms (less the image validation time) on every boot
# that goes through MCUboot, which may be close to the host's 2 s Spinel reset timeout. Measure first.
#
# Use: add it to -Dmcuboot_EXTRA_CONF_FILE="mcuboot/mcuboot.conf;mcuboot/mcuboot-recovery-wait.conf"
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=500
