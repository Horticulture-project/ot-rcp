# Kconfig fragment for the RCP application (NCS coprocessor sample), MCUboot variants only
# (passed with -DEXTRA_CONF_FILE=...). The NCS sample is not modified.
#
# Spinel CMD_RESET with reset type SPINEL_RESET_BOOTLOADER makes the RCP set the retained boot mode
# (zephyr,boot-mode chosen node, GPREGRET based on both boards) and warm reboot. MCUboot then stays in
# serial recovery (CONFIG_BOOT_SERIAL_BOOT_MODE in mcuboot.conf).
# modules/openthread/Kconfig.features: OPENTHREAD_PLATFORM_BOOTLOADER_MODE_RETENTION
#   depends on RETENTION_BOOT_MODE && REBOOT.

CONFIG_REBOOT=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_OPENTHREAD_PLATFORM_BOOTLOADER_MODE_RETENTION=y
