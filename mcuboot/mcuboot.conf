# Kconfig fragment for the MCUboot image (passed with -Dmcuboot_EXTRA_CONF_FILE=...).
# Serial recovery over the same UART pins as the RCP's Spinel/HDLC link. The pins come from
# boards/<board>.overlay, the baud rate from the CI generated overlay-mcuboot-uart.overlay (fixed
# 115200 by default, 8N1, NO hardware flow control, independent of the application variant), both
# passed with -Dmcuboot_EXTRA_DTC_OVERLAY_FILE. See docss/bootloader_and_update.md.

CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y

# The UART is also the Zephyr console on both boards; serial_adapter.c fails the build if the UART
# console is left on, and nothing may print on the wire during recovery anyway.
CONFIG_UART_CONSOLE=n

# Enter recovery when the application requested it (Spinel reset-to-bootloader sets the
# retained boot mode, see app.conf), or when there is no bootable image.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# No boot pin: boards/*.overlay do not wire a button and the DK button pin may be unconnected or
# used on the real module. Do not enable without checking the pin (see the document).
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# Upload into the secondary slot (SMP "image" field 2); field 0/1 stays the primary slot.
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y

# `image list` with flags/hashes and `image test <hash>` in recovery mode.
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y

# Cheap liveness probe: `mcumgr-client echo hello`.
CONFIG_BOOT_MGMT_ECHO=y
