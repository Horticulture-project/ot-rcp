# Signature type for nRF52840 (Ebyte E73). The signing key is NOT set here:
#  - CI writes SB_CONFIG_BOOT_SIGNATURE_KEY_FILE into a generated fragment from a GitHub secret.
#  - Without it MCUboot's public development key (root-ec-p256.pem) is used. INSECURE, dev only.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
