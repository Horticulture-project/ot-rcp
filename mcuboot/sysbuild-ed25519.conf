# Signature type for nRF54L15 (Ezurio). The signing key is NOT set here:
#  - CI writes SB_CONFIG_BOOT_SIGNATURE_KEY_FILE into a generated fragment from a GitHub secret.
#  - Without it MCUboot's public development key (root-ed25519.pem) is used. INSECURE, dev only.
# KMU key storage (SB_CONFIG_MCUBOOT_SIGNATURE_USING_KMU) is intentionally left off: the public key
# is embedded in the MCUboot image, so no key provisioning step is needed after the SWD flash.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
