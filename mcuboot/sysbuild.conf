# Sysbuild (SB_CONFIG_*) options shared by the MCUboot variants of the UART boards
# (Ebyte E73 nrf52840dk/nrf52840 and Ezurio nrf54l15dk/nrf54l15/cpuapp).
# Passed from CI with -DSB_EXTRA_CONF_FILE=... ; the NCS sample itself is not modified.
# See docss/bootloader_and_update.md.

SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Upload goes to the secondary slot, MCUboot validates the signature and copies it over the
# primary slot at the next boot. No swap, so no image confirmation is needed: the RCP application
# has no MCUmgr server and cannot confirm an image.
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# One updateable image (the RCP application). Slots come from the board devicetree partitions
# (this NCS sample disables the partition manager in its Kconfig.sysbuild).
SB_CONFIG_MCUBOOT_UPDATEABLE_IMAGES=1

# Also produce build/merged_<board>.hex (MCUboot + signed application) for the first SWD flash.
SB_CONFIG_MERGED_HEX_FILES=y
